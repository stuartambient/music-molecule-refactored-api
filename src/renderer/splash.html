<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'none'"
    />
    <title>Music Molecule</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 16px;
        text-align: center;
        color: #f1f6f7;
        background: #142530;
        font-family: 'Segoe UI', Arial, sans-serif;
        -webkit-app-region: drag;
      }
      h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0;
        color: #b9ccd4;
        font-size: 14px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 4px;
        border: 3px solid #334f5c;
        border-top-color: #85e0d2;
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Music Molecule</h1>
    <p role="status">Opening your music library…</p>
  </body>
</html>
